<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0908">
<title>Entrar — Área de Treino Allaz Fit</title>
<link rel="icon" href="../assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<main class="login">
  <div class="login__faixa login__faixa--1" aria-hidden="true"></div>
  <div class="login__faixa login__faixa--2" aria-hidden="true"></div>

  <div class="login__caixa">
    <div class="login__marca">
      <img src="../assets/logo.jpg" alt="Allaz Fit">
      <div>
        <h1 class="login__titulo">Área de treino</h1>
        <p class="login__sub">Seu treino, onde você estiver.</p>
      </div>
    </div>

    <form id="form">
      <label class="campo">
        <span class="campo__rotulo">E-mail</span>
        <input type="email" id="email" autocomplete="username" placeholder="voce@exemplo.com" required>
      </label>

      <label class="campo">
        <span class="campo__rotulo">Senha</span>
        <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required>
      </label>

      <button class="b b--primario b--bloco" type="submit">Entrar</button>
    </form>

    <div class="demo-aviso">
      <b>Demonstração.</b> Não há cadastro real nesta versão — entre com qualquer
      e-mail e senha e escolha por qual lado quer ver o sistema.
      <div style="display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap">
        <a class="b b--fantasma" style="flex:1;min-width:130px" href="personal.html">Ver como personal</a>
        <a class="b b--fantasma" style="flex:1;min-width:130px" href="treino.html">Ver como aluno</a>
      </div>
    </div>
  </div>
</main>

<script type="module">
  // No protótipo o login não valida nada: ele existe para mostrar o formato.
  // Quem digita um e-mail com "aluno" entra pelo lado do aluno; o resto, pelo
  // do personal — assim dá para demonstrar os dois caminhos sem explicar nada.
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.toLowerCase();
    const destino = email.includes('aluno') ? 'treino.html' : 'personal.html';
    window.location.href = destino;
  });
</script>

</body>
</html>
