<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0908">
<title>Entrar — Área de Treino Allaz Fit</title>
<link rel="icon" href="../assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<main class="login">
  <div class="login__faixa login__faixa--1" aria-hidden="true"></div>
  <div class="login__faixa login__faixa--2" aria-hidden="true"></div>

  <div class="login__caixa">
    <div class="login__marca">
      <img src="../assets/logo.jpg" alt="Allaz Fit">
      <div>
        <h1 class="login__titulo">Área de treino</h1>
        <p class="login__sub">Seu treino, onde você estiver.</p>
      </div>
    </div>

    <form id="form">
      <label class="campo">
        <span class="campo__rotulo">E-mail</span>
        <input type="email" id="email" autocomplete="username" placeholder="voce@exemplo.com" required>
      </label>

      <label class="campo">
        <span class="campo__rotulo">Senha</span>
        <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required>
      </label>

      <p class="aviso" id="erro" hidden></p>

      <button class="b b--primario b--bloco" type="submit" id="entrar">Entrar</button>
    </form>
  </div>
</main>

<script type="module">
  import { entrar, perfilAtual, paginaDoPapel } from './js/auth.js';

  const perfilJaLogado = await perfilAtual();
  if (perfilJaLogado) {
    window.location.replace(paginaDoPapel(perfilJaLogado.papel));
  }

  const form = document.getElementById('form');
  const botao = document.getElementById('entrar');
  const erro = document.getElementById('erro');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro.hidden = true;
    botao.disabled = true;
    botao.textContent = 'Entrando…';

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const resultado = await entrar(email, senha);

    if (!resultado.ok) {
      erro.textContent = resultado.erro;
      erro.hidden = false;
      botao.disabled = false;
      botao.textContent = 'Entrar';
      return;
    }

    window.location.href = paginaDoPapel(resultado.papel);
  });
</script>

</body>
</html>
