<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0908">
<title>Meu treino — Allaz Fit</title>
<link rel="icon" href="../assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<div id="topo"></div>

<nav class="app-nav" id="nav"></nav>

<main class="app-conteudo">
  <section id="tela-hoje"></section>
  <section id="tela-treino" hidden></section>
  <section id="tela-historico" hidden></section>
  <section id="tela-perfil" hidden></section>
</main>

<dialog id="dlg-video">
  <div class="modal__cabeca">
    <h2 class="modal__titulo" id="v-titulo">Execução</h2>
    <button class="b--icone" id="v-fechar" title="Fechar">✕</button>
  </div>
  <div class="modal__corpo" id="v-corpo"></div>
</dialog>

<script type="module">
import {dados, esc, icone, montarTopo, planoAtivo, letraDivisao,
        sessoesDoAluno, ultimaSessaoDaDivisao, textoDiasDesde, diasDesde,
        ultimoRegistro, textoUltimoRegistro, formatarDataLonga, formatarData,
        divisao, resolverVideo, salvar, reiniciar} from './js/demo.js';

/* No protótipo o aluno é sempre a Camila — a conta com histórico, para a
   demonstração ter o que mostrar. */
const ALUNO_ID = 'a1';
const d = dados();
const eu = d.alunos.find(a => a.id === ALUNO_ID);

document.getElementById('topo').innerHTML = montarTopo({
  titulo: eu.nome.split(' ')[0],
  sub: 'Aluno',
  acoes: `<a class="b b--sutil" href="index.html" title="Sair">${icone.sair}</a>`,
});

/* ---------- navegação ---------- */

const telas = [
  {id:'hoje',      rotulo:'Hoje',      icone:icone.casa},
  {id:'treino',    rotulo:'Treino',    icone:icone.halter},
  {id:'historico', rotulo:'Histórico', icone:icone.grafico},
  {id:'perfil',    rotulo:'Perfil',    icone:icone.pessoa},
];

document.getElementById('nav').innerHTML = telas.map(t => `
  <button data-tela="${t.id}" aria-current="${t.id === 'hoje'}">
    ${t.icone}<span>${t.rotulo}</span>
  </button>`).join('');

let divisaoAberta = null;

function irPara(id){
  telas.forEach(t => {
    document.getElementById('tela-' + t.id).hidden = t.id !== id;
    document.querySelector(`[data-tela="${t.id}"]`).setAttribute('aria-current', String(t.id === id));
  });
  window.scrollTo(0,0);
  if(id === 'hoje') desenharHoje();
  if(id === 'treino') desenharTreino();
  if(id === 'historico') desenharHistorico();
}

document.querySelectorAll('[data-tela]').forEach(b => {
  b.addEventListener('click', () => irPara(b.dataset.tela));
});

/* ---------- Hoje ---------- */

function desenharHoje(){
  const el = document.getElementById('tela-hoje');
  const p = planoAtivo(ALUNO_ID);

  if(!p){
    el.innerHTML = `<div class="vazio" style="margin-top:2rem">
      <strong>Você ainda não tem treino</strong>
      Fale com seu personal para montar o seu plano.
    </div>`;
    return;
  }

  el.innerHTML = `
    <div class="tela-cabecalho">
      <h1 class="tela-titulo">Bom treino</h1>
      <p class="tela-sub">${esc(p.nome)}${p.objetivo ? ' · ' + esc(p.objetivo) : ''}</p>
    </div>

    <div class="lista">
      ${p.divisoes.map(div => {
        const ultima = ultimaSessaoDaDivisao(ALUNO_ID, div.id);
        const dias = diasDesde(ultima?.em);
        const frio = dias === null || dias >= 5;
        const atrasado = dias === null || dias >= 7;
        return `
          <button class="divisao-cartao ${frio ? 'divisao-cartao--frio' : ''}" data-abrir="${esc(div.id)}">
            <span class="divisao-cartao__topo">
              <span class="divisao-cartao__letra">${esc(letraDivisao(div.nome))}</span>
              <span class="divisao-cartao__foco">${esc(div.foco || div.nome)}</span>
            </span>
            <span class="divisao-cartao__rodape">
              <span>${div.exercicios.length} exercícios</span>
              <span class="divisao-cartao__quando ${atrasado ? 'divisao-cartao__quando--atrasado' : ''}">
                ${esc(textoDiasDesde(ultima?.em))}
              </span>
            </span>
          </button>`;
      }).join('')}
    </div>`;

  el.querySelectorAll('[data-abrir]').forEach(b => {
    b.addEventListener('click', () => {
      divisaoAberta = b.dataset.abrir;
      irPara('treino');
    });
  });
}

/* ---------- Treino ---------- */

/* O que o aluno digita fica no aparelho até ele concluir: fechar o app sem
   querer no meio da série não pode custar o registro. */
const rascunhoChave = id => `allazfit-demo-rascunho-${id}`;
function lerRascunho(id){
  try{ return JSON.parse(localStorage.getItem(rascunhoChave(id))) ?? {}; }catch{ return {}; }
}
function gravarRascunho(id, dados){
  try{ localStorage.setItem(rascunhoChave(id), JSON.stringify(dados)); }catch{}
}
function limparRascunho(id){
  try{ localStorage.removeItem(rascunhoChave(id)); }catch{}
}

function desenharTreino(){
  const el = document.getElementById('tela-treino');
  const p = planoAtivo(ALUNO_ID);
  const div = divisaoAberta ? divisao(divisaoAberta) : (p?.divisoes[0] ?? null);

  if(!div){
    el.innerHTML = `<div class="vazio" style="margin-top:2rem">
      <strong>Nenhum treino selecionado</strong>
      Volte para “Hoje” e escolha o treino do dia.
    </div>`;
    return;
  }
  divisaoAberta = div.id;
  const rascunho = lerRascunho(div.id);

  el.innerHTML = `
    <div class="tela-cabecalho">
      <h1 class="tela-titulo">${esc(div.nome)}</h1>
      <p class="tela-sub">${esc(div.foco || '')}</p>
    </div>

    ${div.exercicios.map(ex => {
      const anterior = ultimoRegistro(ALUNO_ID, ex.id);
      const r = rascunho[ex.id] ?? {};
      const temVideo = !!resolverVideo(ex.video);
      const detalhes = [
        ex.carga ? `<span>${esc(ex.carga)}</span>` : '',
        ex.descanso ? `<span>descanso ${esc(ex.descanso)}</span>` : '',
      ].filter(Boolean).join('');

      return `
        <article class="exercicio ${r.feito ? 'exercicio--feito' : ''}" data-ex="${esc(ex.id)}">
          <div class="exercicio__topo">
            <h2 class="exercicio__nome">
              ${esc(ex.nome)}
              ${anterior ? `<span class="exercicio__ultima">da última vez: <b>${esc(textoUltimoRegistro(anterior))}</b></span>` : ''}
            </h2>
          </div>

          <div class="prescricao">
            <span class="prescricao__series">${esc(ex.series ?? '')}</span>
            <span class="prescricao__x">×</span>
            <span class="prescricao__series">${esc(ex.reps ?? '')}</span>
            <span class="prescricao__detalhes">${detalhes}</span>
          </div>

          ${ex.obs ? `<p class="exercicio__obs">${esc(ex.obs)}</p>` : ''}

          <div class="registro">
            <span class="registro__campo">
              <label for="c-${esc(ex.id)}">Carga (kg)</label>
              <input id="c-${esc(ex.id)}" inputmode="decimal" value="${esc(r.carga ?? '')}"
                     placeholder="${esc(anterior?.carga ?? '—')}" data-campo="carga" data-de="${esc(ex.id)}">
            </span>
            <span class="registro__campo">
              <label for="r-${esc(ex.id)}">Repetições</label>
              <input id="r-${esc(ex.id)}" inputmode="numeric" value="${esc(r.reps ?? '')}"
                     placeholder="${esc(anterior?.reps ?? '—')}" data-campo="reps" data-de="${esc(ex.id)}">
            </span>
            <button class="feito-btn" data-feito="${esc(ex.id)}" aria-pressed="${!!r.feito}">
              ${icone.check} Feito
            </button>
            ${temVideo ? `<button class="feito-btn" data-video="${esc(ex.id)}">${icone.play} Execução</button>` : ''}
          </div>
        </article>`;
    }).join('')}

    <div class="treino-rodape">
      <div class="treino-progresso">
        <span id="prog-texto"></span>
        <span class="treino-progresso__barra">
          <span class="treino-progresso__preenchido" id="prog-barra" style="width:0%"></span>
        </span>
      </div>
      <label class="campo">
        <span class="campo__rotulo">Como foi o treino? (opcional)</span>
        <textarea id="obs-sessao" placeholder="Ombro incomodou na terceira série.">${esc(rascunho.__obs ?? '')}</textarea>
      </label>
      <button class="b b--primario b--bloco" id="concluir">Concluir treino</button>
    </div>`;

  /* --- interação --- */

  const salvarRascunho = () => gravarRascunho(div.id, rascunho);

  el.querySelectorAll('[data-campo]').forEach(inp => {
    inp.addEventListener('input', e => {
      const id = e.target.dataset.de;
      rascunho[id] = rascunho[id] ?? {};
      rascunho[id][e.target.dataset.campo] = e.target.value;
      salvarRascunho();
      atualizarProgresso();
    });
  });

  el.querySelectorAll('[data-feito]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.feito;
      rascunho[id] = rascunho[id] ?? {};
      rascunho[id].feito = !rascunho[id].feito;
      b.setAttribute('aria-pressed', String(!!rascunho[id].feito));
      b.closest('.exercicio').classList.toggle('exercicio--feito', !!rascunho[id].feito);
      salvarRascunho();
      atualizarProgresso();
    });
  });

  el.querySelectorAll('[data-video]').forEach(b => {
    b.addEventListener('click', () => {
      const ex = div.exercicios.find(x => x.id === b.dataset.video);
      abrirVideo(ex);
    });
  });

  document.getElementById('obs-sessao').addEventListener('input', e => {
    rascunho.__obs = e.target.value;
    salvarRascunho();
  });

  function atualizarProgresso(){
    const total = div.exercicios.length;
    const feitos = div.exercicios.filter(ex => rascunho[ex.id]?.feito).length;
    document.getElementById('prog-texto').textContent = `${feitos} de ${total}`;
    document.getElementById('prog-barra').style.width = `${(feitos/total)*100}%`;
  }
  atualizarProgresso();

  document.getElementById('concluir').addEventListener('click', () => {
    const registros = {};
    for(const ex of div.exercicios){
      const r = rascunho[ex.id];
      if(!r) continue;
      const carga = r.carga === '' || r.carga == null ? null : Number(r.carga);
      const reps  = r.reps  === '' || r.reps  == null ? null : Number(r.reps);
      if(carga != null || reps != null || r.feito) registros[ex.id] = {carga, reps};
    }

    d.sessoes.unshift({
      id: 's' + Date.now(),
      alunoId: ALUNO_ID,
      divisaoId: div.id,
      em: new Date().toISOString(),
      obs: rascunho.__obs ?? '',
      registros,
    });
    salvar();
    limparRascunho(div.id);
    irPara('hoje');
  });
}

/* ---------- vídeo ---------- */

const dlgVideo = document.getElementById('dlg-video');
document.getElementById('v-fechar').addEventListener('click', () => dlgVideo.close());
// Sem isto o vídeo continua tocando com o modal fechado.
dlgVideo.addEventListener('close', () => { document.getElementById('v-corpo').innerHTML = ''; });

function abrirVideo(ex){
  const v = resolverVideo(ex.video);
  document.getElementById('v-titulo').textContent = ex.nome;
  const corpo = document.getElementById('v-corpo');

  if(v?.tipo === 'youtube'){
    corpo.innerHTML = `<div class="video-quadro">
      <iframe src="${esc(v.embedUrl)}" allowfullscreen
              allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
              title="Execução de ${esc(ex.nome)}"></iframe>
    </div>`;
  } else if(v?.tipo === 'externo'){
    corpo.innerHTML = `<p style="margin-bottom:1rem;color:var(--smoke)">
      Este vídeo abre fora do aplicativo.</p>
      <a class="b b--primario b--bloco" href="${esc(v.url)}" target="_blank" rel="noopener">Abrir vídeo</a>`;
  } else {
    corpo.innerHTML = `<p style="color:var(--smoke)">Seu personal ainda não anexou um vídeo para este exercício.</p>`;
  }
  dlgVideo.showModal();
}

/* ---------- Histórico ---------- */

function desenharHistorico(){
  const el = document.getElementById('tela-historico');
  const sessoes = sessoesDoAluno(ALUNO_ID);

  if(sessoes.length === 0){
    el.innerHTML = `<div class="vazio" style="margin-top:2rem">
      <strong>Seu histórico começa no primeiro treino</strong>
      Conclua um treino e ele aparece aqui, com as cargas que você usou.
    </div>`;
    return;
  }

  const grupos = new Map();
  for(const s of sessoes){
    if(!grupos.has(s.divisaoId)) grupos.set(s.divisaoId, []);
    grupos.get(s.divisaoId).push(s);
  }

  el.innerHTML = `
    <div class="tela-cabecalho">
      <h1 class="tela-titulo">Histórico</h1>
      <p class="tela-sub">${sessoes.length} treinos concluídos. Toque num treino para ver a evolução das cargas.</p>
    </div>
    ${[...grupos.entries()].map(([divId, lista]) => {
      const div = divisao(divId);
      const nome = div ? div.nome : 'Treino removido';
      return `
        <div class="historico-grupo">
          <button class="historico-grupo__cabeca" data-grupo="${esc(divId)}" aria-expanded="false">
            <span class="historico-grupo__letra">${esc(letraDivisao(nome))}</span>
            <span class="historico-grupo__info">
              <span class="historico-grupo__titulo">${esc(nome)}</span>
              <span class="historico-grupo__meta">
                ${lista.length} ${lista.length === 1 ? 'vez' : 'vezes'}
                · última em ${esc(formatarDataLonga(lista[0].em))}
              </span>
            </span>
            <span class="aluno-linha__seta">${icone.baixo}</span>
          </button>
          <div class="historico-grupo__corpo" id="h-${esc(divId)}" hidden>
            ${evolucaoDe(div, lista)}
          </div>
        </div>`;
    }).join('')}`;

  el.querySelectorAll('[data-grupo]').forEach(b => {
    b.addEventListener('click', () => {
      const corpo = document.getElementById('h-' + b.dataset.grupo);
      const aberto = !corpo.hidden;
      corpo.hidden = aberto;
      b.setAttribute('aria-expanded', String(!aberto));
    });
  });
}

function evolucaoDe(div, sessoes){
  if(!div) return '<p style="color:var(--smoke-2);font-size:.9rem">Este treino não está mais no seu plano.</p>';

  const blocos = div.exercicios.map(ex => {
    const pontos = sessoes
      .map(s => ({em:s.em, ...(s.registros?.[ex.id] ?? {})}))
      .filter(p => p.carga != null || p.reps != null);
    if(pontos.length === 0) return '';

    return `
      <div style="margin-bottom:1.1rem">
        <div style="font-weight:600;color:var(--bone);font-size:.92rem;margin-bottom:.35rem">${esc(ex.nome)}</div>
        <div class="evolucao">
          ${pontos.map((p, i) => {
            const ant = pontos[i+1];
            let delta = '<span class="evolucao__delta"></span>';
            if(ant && p.carga != null && ant.carga != null){
              const dif = +(p.carga - ant.carga).toFixed(1);
              if(dif > 0)      delta = `<span class="evolucao__delta evolucao__delta--sobe">+${dif}</span>`;
              else if(dif < 0) delta = `<span class="evolucao__delta evolucao__delta--desce">${dif}</span>`;
              else             delta = `<span class="evolucao__delta evolucao__delta--desce">=</span>`;
            }
            return `
              <div class="evolucao__linha">
                <span class="evolucao__data">${esc(formatarData(p.em))}</span>
                <span class="evolucao__ex">${p.carga != null ? esc(p.carga) + ' kg' : '—'}${p.reps != null ? ' × ' + esc(p.reps) : ''}</span>
                ${delta}
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');

  return blocos || '<p style="color:var(--smoke-2);font-size:.9rem">Treinos concluídos, sem cargas anotadas.</p>';
}

/* ---------- Perfil ---------- */

document.getElementById('tela-perfil').innerHTML = `
  <div class="tela-cabecalho">
    <h1 class="tela-titulo">Perfil</h1>
  </div>

  <div class="plano-cartao" style="margin-bottom:1.2rem">
    <div>
      <div class="campo__rotulo">Nome</div>
      <div style="color:var(--bone);font-weight:600">${esc(eu.nome)}</div>
    </div>
    <div>
      <div class="campo__rotulo">Telefone</div>
      <div style="color:var(--smoke)">${esc(eu.telefone)}</div>
    </div>
  </div>

  <h2 class="secao-rotulo">Trocar senha</h2>
  <p style="color:var(--smoke);font-size:.9rem;margin-bottom:1rem;line-height:1.6">
    Sua senha foi criada pelo seu personal. Vale trocar por uma que só você saiba.
  </p>
  <label class="campo">
    <span class="campo__rotulo">Nova senha</span>
    <input type="password" placeholder="••••••••">
  </label>
  <label class="campo">
    <span class="campo__rotulo">Repita a nova senha</span>
    <input type="password" placeholder="••••••••">
  </label>
  <button class="b b--fantasma b--bloco">Salvar nova senha</button>

  <h2 class="secao-rotulo">Demonstração</h2>
  <button class="b b--sutil" id="reiniciar">Restaurar dados de exemplo</button>
  <p class="campo__dica" style="margin-top:.5rem">
    Apaga os treinos que você registrou nesta demonstração e volta ao estado inicial.
  </p>`;

document.getElementById('reiniciar').addEventListener('click', reiniciar);

/* ---------- início ---------- */
desenharHoje();
</script>

</body>
</html>
