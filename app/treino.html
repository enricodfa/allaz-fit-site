<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0908">
<title>Meu treino — Allaz Fit</title>
<link rel="icon" href="../assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<div id="topo"></div>

<nav class="app-nav" id="nav"></nav>

<main class="app-conteudo">
  <section id="tela-hoje"></section>
  <section id="tela-treino" hidden></section>
  <section id="tela-historico" hidden></section>
  <section id="tela-perfil" hidden></section>
</main>

<script type="module">
import { sb } from './js/supabase.js';
import { exigirSessao, sair, trocarSenha } from './js/auth.js';
import { esc, icone, montarTopo, letraDivisao, textoDiasDesde, diasDesde,
         textoUltimoRegistro, mostrarErro, limparErro } from './js/demo.js';
import { resolverVideo, abrirVideo } from './js/video.js';
import { montarHistorico } from './js/historico.js';
import { lerRascunho, salvarRascunho, limparRascunho } from './js/rascunho.js';

const perfil = await exigirSessao('aluno');

document.getElementById('topo').innerHTML = montarTopo({
  titulo: perfil.nome.split(' ')[0],
  sub: 'Aluno',
});

/* ---------- plano ativo (carregado uma vez; sessões/registros são buscados
   sob demanda, pois mudam a cada treino concluído) ---------- */

const { data: planoRow } = await sb.from('planos')
  .select('id, nome, objetivo')
  .eq('aluno_id', perfil.id).eq('ativo', true)
  .order('criado_em', { ascending: false })
  .limit(1).maybeSingle();

let plano = null;
if (planoRow) {
  const { data: ds } = await sb.from('divisoes')
    .select('id, nome, foco, ordem').eq('plano_id', planoRow.id).order('ordem');
  const divIds = (ds ?? []).map(d => d.id);
  const { data: exs } = divIds.length
    ? await sb.from('exercicios')
        .select('id, divisao_id, nome, series, repeticoes, carga, descanso_seg, observacoes, video_url, ordem')
        .in('divisao_id', divIds).order('ordem')
    : { data: [] };
  plano = {
    ...planoRow,
    divisoes: (ds ?? []).map(d => ({ ...d, exercicios: (exs ?? []).filter(e => e.divisao_id === d.id) })),
  };
}

/* ---------- navegação ---------- */

const telas = [
  { id: 'hoje',      rotulo: 'Hoje',      icone: icone.casa },
  { id: 'treino',    rotulo: 'Treino',    icone: icone.halter },
  { id: 'historico', rotulo: 'Histórico', icone: icone.grafico },
  { id: 'perfil',    rotulo: 'Perfil',    icone: icone.pessoa },
];

document.getElementById('nav').innerHTML = telas.map(t => `
  <button data-tela="${t.id}" aria-current="false">
    ${t.icone}<span>${t.rotulo}</span>
  </button>`).join('');

let divisaoAberta = null;

function irPara(id){
  telas.forEach(t => {
    document.getElementById('tela-' + t.id).hidden = t.id !== id;
    document.querySelector(`[data-tela="${t.id}"]`).setAttribute('aria-current', String(t.id === id));
  });
  window.scrollTo(0, 0);
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  if (id === 'hoje') desenharHoje();
  if (id === 'treino') desenharTreino();
  if (id === 'historico') montarHistorico(perfil.id, document.getElementById('tela-historico'));
  if (id === 'perfil') desenharPerfil();
}

document.querySelectorAll('[data-tela]').forEach(b => {
  b.addEventListener('click', () => irPara(b.dataset.tela));
});

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (telas.some(t => t.id === id)) irPara(id);
});

/* ---------- Hoje ---------- */

async function desenharHoje(){
  const el = document.getElementById('tela-hoje');

  if (!plano) {
    el.innerHTML = `<div class="vazio" style="margin-top:2rem">
      <strong>Você ainda não tem um treino ativo</strong>
      Fale com seu personal.
    </div>`;
    return;
  }

  const { data: ultimas } = await sb.from('sessoes')
    .select('divisao_id, concluido_em')
    .in('divisao_id', plano.divisoes.map(d => d.id))
    .order('concluido_em', { ascending: false });
  const ultimaPorDivisao = {};
  for (const s of ultimas ?? []) {
    if (!(s.divisao_id in ultimaPorDivisao)) ultimaPorDivisao[s.divisao_id] = s.concluido_em;
  }

  el.innerHTML = `
    <div class="tela-cabecalho">
      <h1 class="tela-titulo">Bom treino</h1>
      <p class="tela-sub">${esc(plano.nome)}${plano.objetivo ? ' · ' + esc(plano.objetivo) : ''}</p>
    </div>

    <div class="lista">
      ${plano.divisoes.map(div => {
        const ultima = ultimaPorDivisao[div.id] ?? null;
        const dias = diasDesde(ultima);
        const frio = dias === null || dias >= 5;
        const atrasado = dias === null || dias >= 7;
        return `
          <button class="divisao-cartao ${frio ? 'divisao-cartao--frio' : ''}" data-abrir="${esc(div.id)}">
            <span class="divisao-cartao__topo">
              <span class="divisao-cartao__letra">${esc(letraDivisao(div.nome))}</span>
              <span class="divisao-cartao__foco">${esc(div.foco || div.nome)}</span>
            </span>
            <span class="divisao-cartao__rodape">
              <span>${div.exercicios.length} exercícios</span>
              <span class="divisao-cartao__quando ${atrasado ? 'divisao-cartao__quando--atrasado' : ''}">
                ${esc(textoDiasDesde(ultima))}
              </span>
            </span>
          </button>`;
      }).join('')}
    </div>`;

  el.querySelectorAll('[data-abrir]').forEach(b => {
    b.addEventListener('click', () => {
      divisaoAberta = b.dataset.abrir;
      irPara('treino');
    });
  });
}

/* ---------- Treino ---------- */

async function desenharTreino(){
  const el = document.getElementById('tela-treino');

  if (!plano) {
    el.innerHTML = `<div class="vazio" style="margin-top:2rem">
      <strong>Nenhum treino ativo</strong>
      Fale com seu personal para montar o seu plano.
    </div>`;
    return;
  }

  const div = divisaoAberta ? plano.divisoes.find(d => d.id === divisaoAberta) : plano.divisoes[0];
  if (!div) {
    el.innerHTML = `<div class="vazio" style="margin-top:2rem">
      <strong>Nenhum treino selecionado</strong>
      Volte para "Hoje" e escolha o treino do dia.
    </div>`;
    return;
  }
  divisaoAberta = div.id;

  const { data: anteriores } = await sb
    .from('registros')
    .select('exercicio_id, carga, repeticoes, sessoes!inner(concluido_em)')
    .in('exercicio_id', div.exercicios.map(e => e.id))
    .order('concluido_em', { referencedTable: 'sessoes', ascending: false });
  // Primeira ocorrência de cada exercício = a mais recente.
  const ultimoRegistro = {};
  for (const r of anteriores ?? []) {
    if (!(r.exercicio_id in ultimoRegistro)) ultimoRegistro[r.exercicio_id] = r;
  }

  const rascunho = lerRascunho(div.id);

  el.innerHTML = `
    <div class="tela-cabecalho">
      <h1 class="tela-titulo">${esc(div.nome)}</h1>
      <p class="tela-sub">${esc(div.foco || '')}</p>
    </div>

    ${div.exercicios.map(ex => {
      const anterior = ultimoRegistro[ex.id] ?? null;
      const r = rascunho[ex.id] ?? {};
      const temVideo = !!resolverVideo(ex.video_url);
      const detalhes = [
        ex.carga ? `<span>${esc(ex.carga)}</span>` : '',
        ex.descanso_seg ? `<span>descanso ${esc(ex.descanso_seg)}s</span>` : '',
      ].filter(Boolean).join('');

      return `
        <article class="exercicio ${r.feito ? 'exercicio--feito' : ''}" data-ex="${esc(ex.id)}">
          <div class="exercicio__topo">
            <h2 class="exercicio__nome">
              ${esc(ex.nome)}
              ${anterior ? `<span class="exercicio__ultima">da última vez: <b>${esc(textoUltimoRegistro(anterior))}</b></span>` : ''}
            </h2>
          </div>

          <div class="prescricao">
            <span class="prescricao__series">${esc(ex.series ?? '')}</span>
            <span class="prescricao__x">×</span>
            <span class="prescricao__series">${esc(ex.repeticoes ?? '')}</span>
            <span class="prescricao__detalhes">${detalhes}</span>
          </div>

          ${ex.observacoes ? `<p class="exercicio__obs">${esc(ex.observacoes)}</p>` : ''}

          <div class="registro">
            <span class="registro__campo">
              <label for="c-${esc(ex.id)}">Carga (kg)</label>
              <input id="c-${esc(ex.id)}" inputmode="decimal" value="${esc(r.carga ?? '')}"
                     placeholder="${esc(anterior?.carga ?? '—')}" data-campo="carga" data-de="${esc(ex.id)}">
            </span>
            <span class="registro__campo">
              <label for="r-${esc(ex.id)}">Repetições</label>
              <input id="r-${esc(ex.id)}" inputmode="numeric" value="${esc(r.repeticoes ?? '')}"
                     placeholder="${esc(anterior?.repeticoes ?? '—')}" data-campo="repeticoes" data-de="${esc(ex.id)}">
            </span>
            <button class="feito-btn" data-feito="${esc(ex.id)}" aria-pressed="${!!r.feito}">
              ${icone.check} Feito
            </button>
            ${temVideo ? `<button class="feito-btn" data-video="${esc(ex.id)}">${icone.play} Ver execução</button>` : ''}
          </div>
        </article>`;
    }).join('')}

    <div class="treino-rodape">
      <div class="treino-progresso">
        <span id="prog-texto"></span>
        <span class="treino-progresso__barra">
          <span class="treino-progresso__preenchido" id="prog-barra" style="width:0%"></span>
        </span>
      </div>
      <p class="aviso" id="erro-treino" hidden></p>
      <label class="campo">
        <span class="campo__rotulo">Como foi o treino? (opcional)</span>
        <textarea id="obs-sessao" placeholder="Ombro incomodou na terceira série.">${esc(rascunho.__obs ?? '')}</textarea>
      </label>
      <button class="b b--primario b--bloco" id="concluir">Concluir treino</button>
    </div>`;

  /* --- interação --- */

  const salvarRascunhoAtual = () => salvarRascunho(div.id, rascunho);

  el.querySelectorAll('[data-campo]').forEach(inp => {
    inp.addEventListener('input', e => {
      const id = e.target.dataset.de;
      rascunho[id] = rascunho[id] ?? {};
      rascunho[id][e.target.dataset.campo] = e.target.value;
      salvarRascunhoAtual();
      atualizarProgresso();
    });
  });

  el.querySelectorAll('[data-feito]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.feito;
      rascunho[id] = rascunho[id] ?? {};
      rascunho[id].feito = !rascunho[id].feito;
      b.setAttribute('aria-pressed', String(!!rascunho[id].feito));
      b.closest('.exercicio').classList.toggle('exercicio--feito', !!rascunho[id].feito);
      salvarRascunhoAtual();
      atualizarProgresso();
    });
  });

  el.querySelectorAll('[data-video]').forEach(b => {
    b.addEventListener('click', () => {
      const ex = div.exercicios.find(x => x.id === b.dataset.video);
      abrirVideo(ex.video_url, ex.nome);
    });
  });

  document.getElementById('obs-sessao').addEventListener('input', e => {
    rascunho.__obs = e.target.value;
    salvarRascunhoAtual();
  });

  function atualizarProgresso(){
    const total = div.exercicios.length;
    const feitos = div.exercicios.filter(ex => rascunho[ex.id]?.feito).length;
    document.getElementById('prog-texto').textContent = `${feitos} de ${total}`;
    document.getElementById('prog-barra').style.width = `${(feitos/total)*100}%`;
  }
  atualizarProgresso();

  document.getElementById('concluir').addEventListener('click', async () => {
    const elErroTreino = document.getElementById('erro-treino');
    limparErro(elErroTreino);
    const botao = document.getElementById('concluir');
    botao.disabled = true;

    // Uma sessão, depois os registros dela. Se os registros falharem, a
    // sessão é apagada — meia sessão salva corromperia o histórico.
    const { data: sessao, error: erroSessao } = await sb
      .from('sessoes')
      .insert({ aluno_id: perfil.id, divisao_id: div.id, observacao: rascunho.__obs || null })
      .select('id').single();

    if (erroSessao) {
      mostrarErro(elErroTreino, 'Não foi possível salvar o treino.');
      botao.disabled = false;
      return;
    }

    const linhas = div.exercicios.map(ex => {
      const r = rascunho[ex.id] ?? {};
      return {
        sessao_id: sessao.id,
        exercicio_id: ex.id,
        carga: r.carga === '' || r.carga == null ? null : Number(r.carga),
        repeticoes: r.repeticoes === '' || r.repeticoes == null ? null : Number(r.repeticoes),
        feito: r.feito ?? false,
      };
    });

    const { error: erroRegistros } = await sb.from('registros').insert(linhas);
    if (erroRegistros) {
      await sb.from('sessoes').delete().eq('id', sessao.id);
      mostrarErro(elErroTreino, 'Não foi possível salvar o treino.');
      botao.disabled = false;
      return;
    }

    limparRascunho(div.id);
    irPara('hoje');
  });
}

/* ---------- Perfil ---------- */

function desenharPerfil(){
  const el = document.getElementById('tela-perfil');
  el.innerHTML = `
    <div class="tela-cabecalho">
      <h1 class="tela-titulo">Perfil</h1>
    </div>

    <div class="plano-cartao" style="margin-bottom:1.2rem">
      <div>
        <div class="campo__rotulo">Nome</div>
        <div style="color:var(--bone);font-weight:600">${esc(perfil.nome)}</div>
      </div>
      <div>
        <div class="campo__rotulo">Telefone</div>
        <div style="color:var(--smoke)">${esc(perfil.telefone || '—')}</div>
      </div>
    </div>

    <h2 class="secao-rotulo">Trocar senha</h2>
    <p style="color:var(--smoke);font-size:.9rem;margin-bottom:1rem;line-height:1.6">
      Sua senha foi criada pelo seu personal. Recomendamos trocá-la agora.
    </p>
    <p class="aviso" id="senha-erro" hidden></p>
    <p class="aviso aviso--ok" id="senha-ok" hidden>Senha alterada.</p>
    <label class="campo">
      <span class="campo__rotulo">Nova senha</span>
      <input type="password" id="nova-senha" placeholder="••••••••">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Repita a nova senha</span>
      <input type="password" id="nova-senha-2" placeholder="••••••••">
    </label>
    <button class="b b--fantasma b--bloco" id="salvar-senha">Salvar nova senha</button>

    <h2 class="secao-rotulo" style="margin-top:2rem">Conta</h2>
    <button class="b b--sutil" id="sair-perfil">Sair</button>`;

  document.getElementById('sair-perfil').addEventListener('click', async () => {
    await sair();
    window.location.replace('index.html');
  });

  document.getElementById('salvar-senha').addEventListener('click', async () => {
    const elErro = document.getElementById('senha-erro');
    const elOk = document.getElementById('senha-ok');
    limparErro(elErro);
    elOk.hidden = true;

    const nova = document.getElementById('nova-senha').value;
    const nova2 = document.getElementById('nova-senha-2').value;
    if (nova !== nova2) {
      mostrarErro(elErro, 'As senhas não coincidem.');
      return;
    }
    const resultado = await trocarSenha(nova);
    if (!resultado.ok) {
      mostrarErro(elErro, resultado.erro);
      return;
    }
    elOk.hidden = false;
    document.getElementById('nova-senha').value = '';
    document.getElementById('nova-senha-2').value = '';
  });
}

/* ---------- início ---------- */

const inicial = location.hash.slice(1);
irPara(telas.some(t => t.id === inicial) ? inicial : 'hoje');
</script>

</body>
</html>
