<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0908">
<title>Meus alunos — Allaz Fit</title>
<link rel="icon" href="../assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<div id="topo"></div>

<main class="app-conteudo">
  <div class="tela-cabecalho">
    <h1 class="tela-titulo">Meus alunos</h1>
    <p class="tela-sub">Quem está treinando, quem sumiu, e o que cada um tem para fazer.</p>
  </div>

  <div class="busca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" id="busca" placeholder="Buscar aluno pelo nome" aria-label="Buscar aluno">
  </div>

  <div class="barra-acao">
    <button class="b b--primario" id="novo-aluno">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Novo aluno
    </button>
  </div>

  <div class="lista" id="lista"></div>
  <div id="vazio"></div>
</main>

<dialog id="dlg-novo">
  <form method="dialog">
    <div class="modal__cabeca">
      <h2 class="modal__titulo">Novo aluno</h2>
    </div>
    <div class="modal__corpo">
      <p class="aviso" id="n-erro" hidden></p>
      <label class="campo">
        <span class="campo__rotulo">Nome completo</span>
        <input id="n-nome" placeholder="Camila Souza" required>
      </label>
      <label class="campo">
        <span class="campo__rotulo">E-mail</span>
        <input id="n-email" type="email" placeholder="camila@exemplo.com" required>
      </label>
      <div class="campo-linha campo-linha--2" style="margin-bottom:1rem">
        <label class="campo">
          <span class="campo__rotulo">Telefone</span>
          <input id="n-telefone" placeholder="(48) 99999-0000">
        </label>
        <label class="campo">
          <span class="campo__rotulo">Senha inicial</span>
          <input id="n-senha" value="allaz2026" required minlength="6">
        </label>
      </div>
      <p class="campo__dica">
        O aluno entra com esse e-mail e senha, e pode trocar a senha depois no
        perfil dele.
      </p>
    </div>
    <div class="modal__rodape">
      <button class="b b--fantasma" type="button" id="n-cancelar">Cancelar</button>
      <button class="b b--primario" type="button" id="n-salvar">Cadastrar aluno</button>
    </div>
  </form>
</dialog>

<script type="module">
import { sb } from './js/supabase.js';
import { exigirSessao, sair } from './js/auth.js';
import { esc, iniciais, montarTopo, icone, textoDiasDesde, diasDesde } from './js/demo.js';

const perfil = await exigirSessao('personal');

document.getElementById('topo').innerHTML = montarTopo({
  titulo: perfil.nome,
  sub: 'Personal trainer',
  acoes: `<a class="b b--sutil" href="#" id="sair" title="Sair">${icone.sair}</a>`,
});
document.getElementById('sair').addEventListener('click', async (e) => {
  e.preventDefault();
  await sair();
  window.location.replace('index.html');
});

const elLista = document.getElementById('lista');
const elVazio = document.getElementById('vazio');
const elBusca = document.getElementById('busca');

let alunos = [];

async function carregar(){
  // Sem filtro por personal_id: o RLS já limita aos alunos deste personal.
  const { data: perfis, error } = await sb
    .from('profiles')
    .select('id, nome, telefone')
    .eq('papel', 'aluno')
    .order('nome');

  if (error) {
    elVazio.innerHTML = `<div class="vazio">Não foi possível carregar seus alunos.</div>`;
    return;
  }

  const [{ data: planos }, { data: sessoes }] = await Promise.all([
    sb.from('planos').select('aluno_id, nome').eq('ativo', true),
    sb.from('sessoes').select('aluno_id, concluido_em').order('concluido_em', { ascending: false }),
  ]);

  const planoPorAluno = new Map((planos ?? []).map(p => [p.aluno_id, p.nome]));
  const ultimaPorAluno = new Map();
  for (const s of sessoes ?? []) {
    if (!ultimaPorAluno.has(s.aluno_id)) ultimaPorAluno.set(s.aluno_id, s.concluido_em);
  }

  alunos = (perfis ?? []).map(a => ({
    ...a,
    plano: planoPorAluno.get(a.id) ?? null,
    ultima_sessao: ultimaPorAluno.get(a.id) ?? null,
  }));
  desenhar();
}

function desenhar(){
  const termo = elBusca.value.trim().toLowerCase();
  const visiveis = alunos.filter(a => a.nome.toLowerCase().includes(termo));

  if(alunos.length === 0){
    elVazio.innerHTML = `<div class="vazio">
      <strong>Nenhum aluno ainda</strong>
      Toque em “Novo aluno” para cadastrar o primeiro.
    </div>`;
    elLista.innerHTML = '';
    return;
  }

  if(visiveis.length === 0){
    elVazio.innerHTML = `<div class="vazio">Nenhum aluno com esse nome.</div>`;
    elLista.innerHTML = '';
    return;
  }

  elVazio.innerHTML = '';
  elLista.innerHTML = visiveis.map(a => {
    const dias = diasDesde(a.ultima_sessao);
    // Quem sumiu é a informação que o personal procura nesta tela.
    const sumido = dias === null || dias >= 7;
    return `
      <a class="aluno-linha" href="aluno.html?id=${esc(a.id)}">
        <div class="aluno-linha__inicial">${esc(iniciais(a.nome))}</div>
        <div class="aluno-linha__corpo">
          <div class="aluno-linha__nome">${esc(a.nome)}</div>
          <div class="aluno-linha__meta">
            ${a.plano ? esc(a.plano) : 'Sem treino ativo'}
          </div>
        </div>
        <span class="chip ${sumido ? 'chip--alerta' : ''}">${esc(textoDiasDesde(a.ultima_sessao))}</span>
        <span class="aluno-linha__seta">${icone.seta}</span>
      </a>`;
  }).join('');
}

elBusca.addEventListener('input', desenhar);
carregar();

/* --- cadastro --- */
const dlg = document.getElementById('dlg-novo');
const elNErro = document.getElementById('n-erro');
document.getElementById('novo-aluno').addEventListener('click', () => {
  elNErro.hidden = true;
  dlg.showModal();
});
document.getElementById('n-cancelar').addEventListener('click', () => dlg.close());

document.getElementById('n-salvar').addEventListener('click', async () => {
  const nome = document.getElementById('n-nome').value.trim();
  const email = document.getElementById('n-email').value.trim();
  const telefone = document.getElementById('n-telefone').value.trim();
  const senha = document.getElementById('n-senha').value;

  if (!nome || !email || senha.length < 6) {
    elNErro.textContent = 'Preencha nome, e-mail e uma senha com ao menos 6 caracteres.';
    elNErro.hidden = false;
    return;
  }

  const botao = document.getElementById('n-salvar');
  botao.disabled = true;
  const { data, error } = await sb.functions.invoke('criar-aluno', {
    body: { nome, email, telefone, senha },
  });
  botao.disabled = false;

  if (error) {
    elNErro.textContent = 'Não foi possível falar com o servidor. Tente de novo.';
    elNErro.hidden = false;
    return;
  }
  if (!data.ok) {
    elNErro.textContent = data.erro;
    elNErro.hidden = false;
    return;
  }

  dlg.close();
  document.getElementById('n-nome').value = '';
  document.getElementById('n-email').value = '';
  document.getElementById('n-telefone').value = '';
  document.getElementById('n-senha').value = 'allaz2026';
  await carregar();
});
</script>

</body>
</html>
